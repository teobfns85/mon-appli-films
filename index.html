<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quel film ce soir ?</title>
  <style>
    :root {
      --ink: #29233b;
      --muted: #746d82;
      --paper: #fffdf9;
      --purple: #7454d4;
      --purple-dark: #5438ad;
      --pink: #ffe9ef;
      --yellow: #fff1c8;
      --line: #eee9f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at top left, #f6eaff 0, transparent 35%),
        radial-gradient(ellipse at bottom right, #fff0df 0, transparent 35%),
        #f8f5fc;
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin: 12px 0 26px;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin-bottom: 10px;
      border-radius: 20px;
      background: var(--yellow);
      font-size: 30px;
      transform: rotate(-5deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: -0.06em;
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .panel, .result {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 14px 40px #3920640d;
    }

    .panel { padding: clamp(18px, 5vw, 32px); }

    .question {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 750;
    }

    .group { margin-bottom: 24px; }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .choice {
      border: 1px solid #e7e0ef;
      color: var(--ink);
      background: white;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      transition: .18s ease;
    }

    .choice:hover { border-color: var(--purple); transform: translateY(-1px); }

    .choice[aria-pressed="true"] {
      color: white;
      background: var(--purple);
      border-color: var(--purple);
      box-shadow: 0 5px 14px #7454d433;
    }

    .trend-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 14px;
      border-radius: 16px;
      background: #f7f3ff;
      color: var(--ink);
      margin: 3px 0 22px;
    }

    .trend-row input {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--purple);
      flex: 0 0 auto;
    }

    .trend-row strong { display: block; }
    .trend-row small { display: block; margin-top: 3px; color: var(--muted); }

    .go {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px 18px;
      color: white;
      background: linear-gradient(135deg, var(--purple), #a052c9);
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 8px 20px #7454d433;
      transition: .18s ease;
    }

    .go:hover { transform: translateY(-2px); filter: brightness(1.04); }

    .result {
      display: none;
      overflow: hidden;
      margin-top: 18px;
      animation: appear .3s ease both;
    }

    .result.show { display: block; }

    .poster {
      min-height: 140px;
      display: grid;
      place-items: center;
      font-size: 58px;
      background: linear-gradient(135deg, var(--pink), var(--yellow));
    }

    .result-content { padding: 22px; }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      margin: 0 5px 8px 0;
      border-radius: 999px;
      background: #f1ebff;
      color: var(--purple-dark);
      font-size: .82rem;
      font-weight: 750;
    }

    .result h2 {
      margin: 2px 0 8px;
      font-size: clamp(1.5rem, 5vw, 2rem);
      letter-spacing: -0.04em;
    }

    .result p { line-height: 1.55; }

    .reason {
      padding: 12px 14px;
      border-left: 3px solid var(--purple);
      border-radius: 8px;
      background: #faf7ff;
      color: #554c66;
    }

    .again {
      border: 1px solid #ded5eb;
      padding: 10px 14px;
      border-radius: 12px;
      background: white;
      color: var(--purple-dark);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .note {
      text-align: center;
      margin: 15px 8px 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.45;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      .choice { padding: 9px 12px; font-size: .94rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">🍿</div>
      <h1>Quel film ce soir&nbsp;?</h1>
      <p>Dis-moi ton humeur, je m’occupe du choix.</p>
    </header>

    <section class="panel" aria-label="Préférences du film">
      <div class="group">
        <p class="question">Tu es d’humeur à quoi&nbsp;?</p>
        <div class="choices" id="moodChoices">
          <button class="choice" data-value="peur" aria-pressed="true">😱 Me faire peur</button>
          <button class="choice" data-value="rire" aria-pressed="false">😂 Rire</button>
          <button class="choice" data-value="detente" aria-pressed="false">🛋️ Me détendre</button>
          <button class="choice" data-value="emotion" aria-pressed="false">🥹 Être ému·e</button>
          <button class="choice" data-value="aventure" aria-pressed="false">🚀 Partir à l’aventure</button>
          <button class="choice" data-value="suspense" aria-pressed="false">🕵️ Avoir du suspense</button>
        </div>
      </div>

      <div class="group">
        <p class="question">Quelle saison ou occasion&nbsp;?</p>
        <div class="choices" id="seasonChoices">
          <button class="choice" data-value="auto" aria-pressed="true">✨ Saison actuelle</button>
          <button class="choice" data-value="halloween" aria-pressed="false">🎃 Halloween</button>
          <button class="choice" data-value="hiver" aria-pressed="false">❄️ Hiver / Noël</button>
          <button class="choice" data-value="ete" aria-pressed="false">☀️ Été</button>
          <button class="choice" data-value="toutes" aria-pressed="false">🌈 N’importe quand</button>
        </div>
      </div>

      <label class="trend-row">
        <input id="trending" type="checkbox">
        <span>
          <strong>✨ Je veux aussi un film tendance</strong>
          <small>Sélection spéciale Halloween 2026, préparée à la main.</small>
        </span>
      </label>

      <button class="go" id="recommend">Trouve-moi un film 🎬</button>
    </section>

    <section class="result" id="result" aria-live="polite">
      <div class="poster" id="poster" aria-hidden="true">🎬</div>
      <div class="result-content">
        <div id="badges"></div>
        <h2 id="title"></h2>
        <p id="description"></p>
        <p class="reason" id="reason"></p>
        <button class="again" id="another">🎲 Propose-m’en un autre</button>
      </div>
    </section>

    <p class="note">
      Les plateformes et les catalogues changent selon le pays et la date.
      Cette petite appli recommande des films, mais ne vérifie pas leur disponibilité.
    </p>
  </main>

  <script>
    const films = [
      {
        title: "Scream 7",
        moods: ["peur", "suspense"],
        seasons: ["halloween"],
        trending: true,
        emoji: "🔪",
        intensity: "Assez effrayant",
        description: "Un choix pour une soirée slasher, avec des mystères, des suspects et des frissons.",
        reason: "Tu veux avoir peur : voilà une option qui colle bien à l’ambiance Halloween."
      },
      {
        title: "Ready or Not 2: Here I Come",
        moods: ["peur", "rire", "suspense"],
        seasons: ["halloween"],
        trending: true,
        emoji: "🏃‍♀️",
        intensity: "Horreur et humour noir",
        description: "Une aventure horrifique qui mélange danger, rythme et humour macabre.",
        reason: "Parfait si tu veux des frissons sans renoncer à un côté déjanté."
      },
      {
        title: "A Quiet Place: Day One",
        moods: ["peur", "suspense", "emotion"],
        seasons: ["halloween"],
        trending: true,
        emoji: "🤫",
        intensity: "Tension forte",
        description: "Une histoire de survie où le silence devient essentiel.",
        reason: "Pour une soirée pleine de tension et de suspense."
      },
      {
        title: "Hocus Pocus",
        moods: ["rire", "detente"],
        seasons: ["halloween", "hiver"],
        trending: true,
        emoji: "🧙‍♀️",
        intensity: "Tout doux",
        description: "Des sorcières, de la magie et une ambiance Halloween amusante.",
        reason: "Tu veux une touche d’Halloween sans choisir un film trop effrayant."
      },
      {
        title: "The Substance",
        moods: ["peur", "suspense"],
        seasons: ["halloween"],
        trending: true,
        emoji: "🧪",
        intensity: "Très intense",
        description: "Un film étrange et troublant, à réserver si tu as envie d’une expérience marquante.",
        reason: "Tu as demandé une ambiance inquiétante : celui-ci va loin dans le malaise."
      },
      {
        title: "Sinners",
        moods: ["peur", "suspense", "aventure"],
        seasons: ["halloween"],
        trending: true,
        emoji: "🌙",
        intensity: "Sombre",
        description: "Une histoire sombre, entre horreur, mystère et tension.",
        reason: "Un bon choix si tu veux quelque chose de mystérieux et d’un peu inquiétant."
      },
      {
        title: "Weapons",
        moods: ["peur", "suspense"],
        seasons: ["halloween"],
        trending: true,
        emoji: "🕯️",
        intensity: "Effrayant",
        description: "Un film d’horreur à l’atmosphère mystérieuse, pour une soirée qui fait frissonner.",
        reason: "Tu as choisi les frissons : ce film est dans la sélection Halloween."
      },
      {
        title: "The Shining",
        moods: ["peur", "suspense"],
        seasons: ["hiver", "halloween"],
        trending: false,
        emoji: "🏨",
        intensity: "Très effrayant",
        description: "Un classique glaçant dans un hôtel isolé, où l’ambiance devient de plus en plus inquiétante.",
        reason: "Un choix idéal si tu veux une atmosphère glaciale et du suspense."
      },
      {
        title: "The Nightmare Before Christmas",
        moods: ["detente", "aventure"],
        seasons: ["halloween", "hiver"],
        trending: false,
        emoji: "💀",
        intensity: "Fantaisie",
        description: "Une aventure fantastique entre Halloween et Noël, pleine de personnages singuliers.",
        reason: "Tu veux une histoire magique qui fonctionne aussi bien en automne qu’en hiver."
      },
      {
        title: "Paddington 2",
        moods: ["rire", "detente", "emotion"],
        seasons: ["hiver", "toutes"],
        trending: false,
        emoji: "🐻",
        intensity: "Tout doux",
        description: "Une comédie chaleureuse, drôle et pleine de gentillesse.",
        reason: "Tu as besoin d’un film réconfortant et facile à regarder."
      },
      {
        title: "The Princess Bride",
        moods: ["rire", "aventure", "emotion"],
        seasons: ["ete", "toutes"],
        trending: false,
        emoji: "⚔️",
        intensity: "Aventure légère",
        description: "Une aventure drôle et romantique, avec des combats, des personnages attachants et de la fantaisie.",
        reason: "Un choix joyeux si tu veux rire et partir à l’aventure."
      },
      {
        title: "Finding Nemo",
        moods: ["detente", "emotion", "aventure"],
        seasons: ["ete", "toutes"],
        trending: false,
        emoji: "🐠",
        intensity: "Familial",
        description: "Une aventure colorée sous la mer, avec de l’humour et beaucoup de cœur.",
        reason: "Tu veux quelque chose de chaleureux et dépaysant."
      },
      {
        title: "Knives Out",
        moods: ["suspense", "rire"],
        seasons: ["hiver", "toutes"],
        trending: false,
        emoji: "🔎",
        intensity: "Mystère amusant",
        description: "Un mystère à résoudre, une famille pleine de secrets et une bonne dose d’humour.",
        reason: "Tu veux réfléchir un peu tout en passant une soirée divertissante."
      },
      {
        title: "La La Land",
        moods: ["emotion", "detente"],
        seasons: ["ete", "toutes"],
        trending: false,
        emoji: "🎹",
        intensity: "Romantique",
        description: "Une romance musicale pleine de rêves, de musique et de belles émotions.",
        reason: "Tu as envie d’un film sensible et d’une ambiance romantique."
      }
    ];

    const moodLabels = {
      peur: "😱 Frissons",
      rire: "😂 Rire",
      detente: "🛋️ Détente",
      emotion: "🥹 Émotion",
      aventure: "🚀 Aventure",
      suspense: "🕵️ Suspense"
    };

    let mood = "peur";
    let season = "auto";
    let previousTitle = "";

    function getCurrentSeason() {
      const month = new Date().getMonth();
      if (month === 9) return "halloween";       // octobre
      if (month === 10 || month === 11 || month === 0) return "hiver";
      if (month >= 5 && month <= 7) return "ete";
      return "toutes";
    }

    function setupChoices(containerId, onPick) {
      const container = document.getElementById(containerId);
      container.addEventListener("click", event => {
        const button = event.target.closest(".choice");
        if (!button) return;

        container.querySelectorAll(".choice").forEach(item => {
          item.setAttribute("aria-pressed", String(item === button));
        });

        onPick(button.dataset.value);
      });
    }

    setupChoices("moodChoices", value => { mood = value; });
    setupChoices("seasonChoices", value => { season = value; });

    function recommend() {
      const chosenSeason = season === "auto" ? getCurrentSeason() : season;
      const trendingOnly = document.getElementById("trending").checked;

      let matches = films.filter(film =>
        film.moods.includes(mood) &&
        (
          chosenSeason === "toutes" ||
          film.seasons.includes(chosenSeason) ||
          film.seasons.includes("toutes")
        ) &&
        (!trendingOnly || film.trending)
      );

      if (matches.length === 0 && trendingOnly) {
        matches = films.filter(film =>
          film.moods.includes(mood) &&
          (
            chosenSeason === "toutes" ||
            film.seasons.includes(chosenSeason) ||
            film.seasons.includes("toutes")
          )
        );
      }

      if (matches.length === 0) {
        matches = films.filter(film => film.moods.includes(mood));
      }

      if (matches.length > 1 && previousTitle) {
        const withoutLast = matches.filter(film => film.title !== previousTitle);
        if (withoutLast.length) matches = withoutLast;
      }

      const film = matches[Math.floor(Math.random() * matches.length)];
      previousTitle = film.title;

      document.getElementById("poster").textContent = film.emoji;
      document.getElementById("title").textContent = film.title;
      document.getElementById("description").textContent = film.description;
      document.getElementById("reason").textContent = film.reason;

      const badges = [
        moodLabels[mood],
        film.intensity,
        film.trending ? "✨ Sélection tendance" : "🍿 À découvrir"
      ];
      document.getElementById("badges").innerHTML = badges
        .map(text => <span class="badge">${text}</span>)
        .join("");

      document.getElementById("result").classList.add("show");
      document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.getElementById("recommend").addEventListener("click", recommend);
    document.getElementById("another").addEventListener("click", recommend);
  </script>
</body>
</html>
